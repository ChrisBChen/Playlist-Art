<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swiss Playlist Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Swiss Playlist Studio</h1>
        <p class="subtitle">Batch playlist covers in a consistent poster system.</p>
      </div>
      <div class="version">v<span id="app-version"></span></div>
    </header>

    <main class="studio">
      <aside class="controls">
        <section class="section">
          <div class="section-heading">
            <h2>Batch</h2>
            <span id="cover-count">4 covers</span>
          </div>
          <label>
            Playlist names
            <textarea id="playlist-input" rows="7" spellcheck="false"></textarea>
          </label>
          <button id="apply-playlists" class="primary">Update Series</button>
          <div class="series-defaults">
            <div class="section-heading compact">
              <h2>Series Defaults</h2>
            </div>
            <div class="defaults-grid">
              <label>
                Kicker
                <input id="default-kicker" type="text" />
              </label>
              <label>
                Footer
                <input id="default-footer" type="text" />
              </label>
              <label>
                Numbering
                <select id="index-preset"></select>
              </label>
              <label>
                Start
                <input id="index-start" type="text" />
              </label>
            </div>
            <button id="apply-series-defaults">Apply Defaults to All</button>
          </div>
        </section>

        <section class="section">
          <div class="section-heading">
            <h2>Art System</h2>
          </div>
          <div id="template-cards" class="template-cards"></div>
        </section>

        <section class="section">
          <div class="section-heading">
            <h2>System Settings</h2>
          </div>
          <label>
            Series seed
            <input id="master-seed" type="text" />
          </label>
          <label>
            Palette
            <select id="palette-select"></select>
          </label>
          <label>
            Background mode
            <select id="background-mode"></select>
          </label>
          <div class="color-grid">
            <label>
              Background
              <input id="custom-background" type="color" />
            </label>
            <label>
              Ink
              <input id="custom-ink" type="color" />
            </label>
            <label>
              Accent
              <input id="custom-accent" type="color" />
            </label>
            <label>
              Secondary
              <input id="custom-accent2" type="color" />
            </label>
          </div>
          <label>
            Grid density
            <input id="grid-density" type="range" min="6" max="12" step="1" />
          </label>
          <label>
            Type scale
            <input id="type-scale" type="range" min="0.8" max="1.25" step="0.05" />
          </label>
          <label>
            Variation
            <input id="variation-strength" type="range" min="0" max="1" step="0.05" />
          </label>
        </section>

        <section class="section">
          <div class="section-heading">
            <h2>Export</h2>
          </div>
          <div class="action-grid">
            <button id="export-selected-png">Selected PNG</button>
            <button id="export-all-png">All PNG ZIP</button>
            <button id="export-selected-jpg">Selected JPG</button>
            <button id="export-all-jpg">All JPG ZIP</button>
          </div>
          <label class="checkbox">
            <input id="export-jpg" type="checkbox" />
            Enable JPG export
          </label>
          <label>
            JPG quality
            <input id="jpg-quality" type="range" min="0.6" max="0.98" step="0.01" />
          </label>
          <div class="action-grid">
            <button id="download-theme">Download Theme</button>
            <button id="import-theme">Import Theme</button>
          </div>
          <input id="import-input" type="file" accept="application/json" hidden />
          <div class="dev-row">
            <button id="determinism-check">Determinism Check</button>
            <span id="determinism-result"></span>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <section class="preview-area">
          <div class="preview-frame">
            <canvas id="preview-canvas" width="1000" height="1000"></canvas>
          </div>
          <div class="preview-meta">
            <div>
              <span id="selected-index">01</span>
              <strong id="preview-title">Morning Run</strong>
            </div>
            <span class="warning" id="title-warning"></span>
          </div>
        </section>

        <section class="series-workbench">
          <div class="section-heading">
            <h2>Series</h2>
            <span>3000x3000 export</span>
          </div>
          <div id="series-gallery" class="series-gallery"></div>
          <div class="row-header" aria-hidden="true">
            <span>No.</span>
            <span>Kicker</span>
            <span>Title</span>
            <span>Footer</span>
            <span>Seed</span>
          </div>
          <div id="series-list" class="series-list"></div>
        </section>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
